name: Release

# Manual only: Actions → Release → "Run workflow" → enter a version like 1.2.3.
# Builds a signed, minified APK, creates the tag v1.2.3 on the chosen branch, and publishes a GitHub Release
# with the APK and its SHA-256 attached.
#
# Signing secrets (Settings → Secrets and variables → Actions):
#   APPWALL_KEYSTORE_BASE64   base64 of your .jks   (base64 -i release.jks | pbcopy)
#   APPWALL_KEYSTORE_PASSWORD
#   APPWALL_KEY_ALIAS
#   APPWALL_KEY_PASSWORD
# Without them the APK is signed with a throwaway debug key (fine for testing, not for distribution).

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, e.g. 1.2.3 (tag v1.2.3 is created for you)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Signed release APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate version
        id: ver
        run: |
          NAME="${{ inputs.version }}"
          NAME="${NAME#v}"
          if ! [[ "$NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Version must look like 1.2.3 (got '$NAME')"; exit 1
          fi
          if git ls-remote --tags origin "refs/tags/v$NAME" | grep -q .; then
            echo "Tag v$NAME already exists"; exit 1
          fi
          # 1.2.3 -> 10203 : monotonic as long as versions ascend
          IFS=. read -r MA MI PA <<< "$NAME"
          CODE=$(( MA * 10000 + MI * 100 + PA ))
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Releasing $NAME (version code $CODE)"

      - name: Decode keystore
        if: ${{ secrets.APPWALL_KEYSTORE_BASE64 != '' }}
        env:
          KEYSTORE_B64: ${{ secrets.APPWALL_KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --no-daemon

      - name: Build release APK
        env:
          APPWALL_KEYSTORE: ${{ secrets.APPWALL_KEYSTORE_BASE64 != '' && format('{0}/release.jks', runner.temp) || '' }}
          APPWALL_KEYSTORE_PASSWORD: ${{ secrets.APPWALL_KEYSTORE_PASSWORD }}
          APPWALL_KEY_ALIAS: ${{ secrets.APPWALL_KEY_ALIAS }}
          APPWALL_KEY_PASSWORD: ${{ secrets.APPWALL_KEY_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease --no-daemon \
            -PappVersionName="${{ steps.ver.outputs.name }}" \
            -PappVersionCode="${{ steps.ver.outputs.code }}"

      - name: Rename and checksum
        run: |
          OUT="AppWall-v${{ steps.ver.outputs.name }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "$OUT"
          sha256sum "$OUT" > "$OUT.sha256"
          ls -la "$OUT"

      - name: Create tag and GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.name }}
          target_commitish: ${{ github.sha }}
          name: AppWall v${{ steps.ver.outputs.name }}
          generate_release_notes: true
          files: |
            AppWall-v${{ steps.ver.outputs.name }}.apk
            AppWall-v${{ steps.ver.outputs.name }}.apk.sha256
